version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://backend:5000   # API URL untuk React build
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/mydb
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=mahirku
      - PORT=5000
      - DB_HOST=db
