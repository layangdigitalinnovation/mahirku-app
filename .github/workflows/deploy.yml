name: Deploy to Dokploy

on:
  push:
    branches: [ "development" ]

jobs:
  quality-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies (Backend)
        working-directory: ./backend
        run: npm ci

      - name: Build Check (Backend)
        working-directory: ./backend
        run: npm run build

  build-and-push:
    needs: quality-check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mahirku-frontend:latest

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mahirku-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Frontend Deployment
        if: secrets.DOKPLOY_FRONTEND_WEBHOOK_URL != ''
        run: curl -X POST "${{ secrets.DOKPLOY_FRONTEND_WEBHOOK_URL }}"

      - name: Trigger Backend Deployment
        if: secrets.DOKPLOY_BACKEND_WEBHOOK_URL != ''
        run: curl -X POST "${{ secrets.DOKPLOY_BACKEND_WEBHOOK_URL }}"
