// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1' // Sesuaikan versi gradle sesuai project
        classpath 'com.facebook.react:react-native-gradle-plugin'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

// Plugin untuk Expo prebuild workflow
apply plugin: 'expo-root-project'

// Plugin untuk React Native
apply plugin: 'com.facebook.react.rootproject'

// Opsional: jika pakai Kotlin di native module
apply plugin: 'kotlin-android'

// Tambahan untuk memastikan semua subproject ikut buildscript
subprojects { subproject ->
    afterEvaluate {
        if (subproject.hasProperty("android")) {
            subproject.android {
                compileSdkVersion rootProject.ext.compileSdkVersion ?: 35
            }
        }
    }
}
