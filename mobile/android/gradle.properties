# Project-wide Gradle settings.

# IDE users: settings in the IDE will override these.
# For details: http://www.gradle.org/docs/current/userguide/build_environment.html

# JVM arguments for Gradle daemon
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# Enable parallel build for multi-projects
org.gradle.parallel=true

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Architectures to build
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Enable new architecture (Fabric & TurboModules)
newArchEnabled=true

# Enable Hermes JS engine
hermesEnabled=true

# Edge-to-edge display support
edgeToEdgeEnabled=true

# Expo image support
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Enable network inspector for dev client
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Legacy packaging for APK compression
expo.useLegacyPackaging=false

# Optional deprecated Expo edge-to-edge setting (kept for backward compatibility)
expo.edgeToEdgeEnabled=true

# Minimum SDK for biometric support
android.minSdkVersion=23

# Optional: Target SDK (Google Play requirement)
android.targetSdkVersion=35
