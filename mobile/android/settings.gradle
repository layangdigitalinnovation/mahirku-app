pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://maven.pkg.jetbrains.space/kotlin/p/kotlin/dev' }
    }

    // Include React Native Gradle Plugin
    def reactNativeGradlePlugin = new File(
        providers.exec {
            workingDir(rootDir)
            commandLine(
                "node",
                "--print",
                "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"
            )
        }.standardOutput.asText.get().trim()
    ).getParentFile().absolutePath
    includeBuild(reactNativeGradlePlugin)
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

// Set root project name
rootProject.name = "Mahirku"

// Apply React Native settings plugin FIRST
apply plugin: "com.facebook.react.settings"

// THEN configure the extension (after plugin is applied)
react {
    if (System.getenv("EXPO_USE_COMMUNITY_AUTOLINKING") == "1") {
        autolinkLibrariesFromCommand()
    } else {
        // Fallback: try Expo autolinking, or use default
        try {
            def expoAutolinking = new File(["node", "--print", "require.resolve('expo-modules-autolinking/package.json')"].execute().text.trim()).getParentFile()
            autolinkLibrariesFromCommand([
                "node",
                new File(expoAutolinking, "scripts/expo-autolinking.js").absolutePath,
                "react-native-config"
            ])
        } catch (Exception e) {
            // Use default React Native autolinking
            autolinkLibrariesFromCommand()
        }
    }
}

// Include main app module
include ':app'