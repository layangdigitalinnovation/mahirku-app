pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

rootProject.name = "Mahirku"

// Wajib: include react-native gradle plugin
includeBuild('../node_modules/react-native-gradle-plugin')

// App module
include ':app'

// EXPO autolinking
apply from: file("../node_modules/expo/scripts/autolinking.gradle")
useExpoModules()

// React Native autolinking
apply from: file("../node_modules/react-native/react.gradle")