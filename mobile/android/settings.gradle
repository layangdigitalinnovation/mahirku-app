pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

rootProject.name = "Mahirku"

// Tambahkan plugin RN 0.81
includeBuild('../node_modules/react-native-gradle-plugin')

include ':app'


// === EXPO AUTO LINKING ===
def expoAutolinkingScript = file(
    new File(
        ["node", "--print", "require.resolve('expo/package.json')"]
            .execute(null, rootDir)
            .text
            .trim()
    ).parent + "/scripts/autolinking.gradle"
)

apply from: expoAutolinkingScript
useExpoModules()
