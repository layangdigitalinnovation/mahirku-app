services:
  frontend:
    image: layangdigital/mahirku-frontend:latest
    depends_on:
      - backend
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`mahirku.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  backend:
    image: layangdigital/mahirku-backend:latest
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - DB_HOST=${DB_HOST:-db}
      - PORT=${PORT:-5000}
      - JWT_SECRET=${JWT_SECRET}
      - XENDIT_API_KEY=${XENDIT_API_KEY}
      - XENDIT_PUBLIC_KEY=${XENDIT_PUBLIC_KEY}
      - XENDIT_BASE_URL=${XENDIT_BASE_URL:-https://api.xendit.co}
      - XENDIT_CALLBACK_URL=${XENDIT_CALLBACK_URL}
      - XENDIT_SUCCESS_REDIRECT_URL=${XENDIT_SUCCESS_REDIRECT_URL}
      - XENDIT_FAILURE_REDIRECT_URL=${XENDIT_FAILURE_REDIRECT_URL}
      - XENDIT_CALLBACK_TOKEN=${XENDIT_CALLBACK_TOKEN}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-false}
      - RUN_SEEDS=${RUN_SEEDS:-false}
    depends_on:
      - db
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`mahirku.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.http.services.backend.loadbalancer.server.port=5000"

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mahirku
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dokploy-network

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup
    restart: unless-stopped
    networks:
      - dokploy-network

volumes:
  pgdata:
    name: mahirku_pgdata
    external: true

networks:
  dokploy-network:
    external: true
