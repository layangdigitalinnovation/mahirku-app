version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:80"  # Map port 80 container ke port 3000 host
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
  
  db:
    ports:
      - "5433:5432"
